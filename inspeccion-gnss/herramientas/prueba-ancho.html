<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Diagnóstico de ancho</title></head>
<body>
<pre id="out">…</pre>
<iframe id="app" src="../index.html" style="width:390px;height:800px;border:1px solid #999" title="app"></iframe>
<script>
/* Busca qué elemento obliga a la página a ser más ancha que la pantalla. */
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n' + m; };
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
const ifr = document.getElementById('app');

(async () => {
  const w = ifr.contentWindow;
  for (let i = 0; i < 40; i++) { await esperar(300); if (w.document.body.dataset.listo === '1') break; }
  await esperar(400);
  const d = w.document;
  const ancho = d.documentElement.clientWidth;
  log('viewport del iframe : ' + ancho);
  log('scrollWidth         : ' + d.documentElement.scrollWidth);
  log('body scrollWidth    : ' + d.body.scrollWidth);
  const malos = [];
  d.querySelectorAll('body *').forEach((el) => {
    const r = el.getBoundingClientRect();
    if (r.right > ancho + 1 || r.width > ancho + 1) {
      malos.push((el.tagName.toLowerCase()) + (el.id ? '#' + el.id : '') + (el.className && typeof el.className === 'string' ? '.' + el.className.split(/\s+/).slice(0, 2).join('.') : '') + ' w=' + Math.round(r.width) + ' right=' + Math.round(r.right));
    }
  });
  log('elementos que se salen: ' + malos.length);
  malos.slice(0, 12).forEach((m) => log('  ' + m));
  log('— FIN —');
})();
</script>
</body></html>
