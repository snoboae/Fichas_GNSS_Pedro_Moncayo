<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba de interfaz 2</title></head>
<body>
<pre id="out">Cargando…</pre>
<iframe id="app" src="../index.html" style="width:1000px;height:700px;border:1px solid #ccc" title="app"></iframe>
<script>
/* Comprueba: selector de app de mapas, altura con coma decimal y guardado de la ficha. */
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n' + m; };
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
const ifr = document.getElementById('app');

/* texto del botón LEVANTAR / EDITAR */
const etiquetaBoton = (d) => {
  const s = d.querySelector('#btnLevantar span:last-child');
  return s ? s.textContent.replace(/\s+/g, ' ').trim() : '?';
};

/* cierra el diálogo de aviso si está abierto (devuelve su texto) */
const cerrarAvisoUI = (d) => {
  const velo = d.getElementById('v-aviso');
  if (!velo || velo.classList.contains('hidden')) return '';
  const txt = d.getElementById('avisoTitulo').textContent + ' | ' +
    [...d.querySelectorAll('#avisoTexto li')].map((li) => li.textContent).join(', ');
  const b = d.querySelector('#avisoBotones .btn.primary') || d.querySelector('#avisoBotones .btn');
  if (b) b.click();
  return txt;
};

function leerFicha(codigo) {
  return new Promise((res) => {
    const r = indexedDB.open('fichas-gnss');
    r.onsuccess = () => {
      const db = r.result;
      const g = db.transaction('fichas', 'readonly').objectStore('fichas').get(codigo);
      g.onsuccess = () => { res(g.result || null); db.close(); };
      g.onerror = () => { res(null); db.close(); };
    };
    r.onerror = () => res(null);
  });
}

(async () => {
  let w = ifr.contentWindow;
  for (let i = 0; i < 40; i++) { await esperar(300); if (w.document.body.dataset.listo === '1') break; }
  await esperar(400);
  const d = w.document;
  log('arranque        : ' + (d.body.dataset.listo || 'no'));

  /* pantalla de inicio: elegir levantamiento */
  const velo = d.getElementById('v-proyecto');
  log('selector inicial: visible=' + (velo && !velo.classList.contains('hidden')) +
      ' · opciones=' + [...(d.querySelectorAll('[data-proy]') || [])].map((b) => b.dataset.proy).join(','));
  const btnPedro = d.querySelector('[data-proy="pedro"]');
  if (btnPedro) btnPedro.click();
  await esperar(700);
  log('proyecto abierto: ' + (d.querySelector('[data-proy-nombre]').textContent || '-'));
  log('barra del levantamiento: ' + (d.querySelector('.proybar') ? d.querySelector('.proybar').textContent.trim().replace(/\\s+/g, ' ') : 'FALTA'));
  log('botones para cambiar: ' + d.querySelectorAll('[data-cambiar-proyecto]').length);

  const items = [...d.querySelectorAll('.combo-item')];
  log('total de sesiones: ' + items.length + ' (' + items.filter((x) => x.querySelector('.tipo.ida')).length + ' IDA / ' + items.filter((x) => x.querySelector('.tipo.vuelta')).length + ' VUELTA)');
  log('primeras 3      : ' + items.slice(0, 3).map((x) => x.dataset.id).join(' | '));
  log('bases primero   : ' + (items.length && /-BASE-/.test(items[0].dataset.id) ? 'sí' : 'NO'));
  log('sin ruta        : ' + [...d.querySelectorAll('.combo-sep')].map((x) => x.textContent).join(' / '));
  const base = items.filter((x) => /BASE/.test(x.textContent));
  log('jornadas de base: ' + base.length + ' · primera=' + (base[0] ? base[0].dataset.id : '-') + ' · etiqueta=' + (base[0] ? base[0].querySelector('.tipo').textContent : '-'));
  log('bases sin ruta  : ' + items.filter((x) => /BASE/.test(x.dataset.id)).map((x) => x.dataset.id).filter((id) => !/-BASE-\\d+$/.test(id)).join(',') || 'ninguna');
  log('sección avance  : ' + (d.getElementById('avancePill') ? 'SIGUE' : 'retirada'));
  log('entradas base   : ' + items.filter((x) => /BASE/.test(x.dataset.id)).map((x) => x.dataset.id).join(', '));
  const itemBaseRg = items.find((x) => /RG-50-01-BASE-/.test(x.dataset.id));
  const idBase = itemBaseRg ? itemBaseRg.dataset.id : 'RG-50-01-BASE-x';
  w.confirm = () => true;
  const itemBase = d.querySelector('.combo-item[data-id="' + idBase + '"]');
  log('item de la base : ' + (itemBase ? 'encontrado' : 'NO ENCONTRADO'));
  if (itemBase) {
    itemBase.click();
    await esperar(300);
    d.getElementById('btnLevantar').click();
    await esperar(900);
    log('ficha base      : titulo="' + d.getElementById('f-titulo').textContent.trim() + '" visible=' + !d.getElementById('v-ficha').classList.contains('hidden'));
    d.getElementById('btnFichaBack').click();
    await esperar(400);
  }

  // ---- 1) selector de app de mapas ----
  d.getElementById('comboBtn').click();
  await esperar(250);
  d.querySelector('.combo-item[data-id="RG-51-02-IDA"]').click();
  await esperar(300);
  d.getElementById('btnIr').click();
  await esperar(400);
  const nav = d.getElementById('navSheet');
  const opciones = [...d.querySelectorAll('#navSheet [data-nav]')].map((b) => b.textContent.trim());
  log('selector de mapas: visible=' + !nav.classList.contains('hidden'));
  log('opciones         : ' + JSON.stringify(opciones));
  log('subtítulo        : "' + d.getElementById('navSub').textContent + '"');
  d.querySelector('#navSheet [data-nav-close]').click();
  await esperar(300);
  log('se cierra        : ' + nav.classList.contains('hidden'));

  // ---- 2) altura con coma decimal ----
  d.getElementById('btnLevantar').click();
  await esperar(700);
  const altura = d.getElementById('f-altura');
  log('altura tipo      : ' + altura.type + ' inputmode=' + altura.getAttribute('inputmode'));
  const previa = d.getElementById('croquisImg');
  await esperar(600);
  log('croquis en ficha : src=' + (previa.getAttribute('src') || '') + ' cargada=' + (previa.naturalWidth > 0) + ' (' + previa.naturalWidth + 'x' + previa.naturalHeight + ')');
  log('sin botones croq : generar=' + !d.getElementById('btnCroquis') + ' preparar=' + !d.getElementById('btnPrepCroquis'));
  d.getElementById('f-receptor').selectedIndex = 1;
  const obsTxa = d.getElementById('f-obs');
  if (obsTxa) { obsTxa.value = 'Se socializó con el dirigente barrial; el hito está sin obstrucciones.'; obsTxa.dispatchEvent(new w.Event('input', { bubbles: true })); }
  log('campo de observaciones: ' + (obsTxa ? 'presente' : 'FALTA'));
  altura.value = '1,532';
  altura.dispatchEvent(new w.Event('input', { bubbles: true }));
  const ini = d.querySelector('[data-ahora="inicio"]');
  const fin = d.querySelector('[data-ahora="fin"]');
  ini.click(); await esperar(150);
  // el fin 5 minutos después (con hora, para que no cruce la medianoche al revés)
  const t0 = new Date(d.getElementById('f-inicio').value);
  t0.setMinutes(t0.getMinutes() + 5);
  const p2 = (x) => String(x).padStart(2, '0');
  d.getElementById('f-fin').value = t0.getFullYear() + '-' + p2(t0.getMonth() + 1) + '-' + p2(t0.getDate()) + 'T' + p2(t0.getHours()) + ':' + p2(t0.getMinutes());
  d.getElementById('f-fin').dispatchEvent(new w.Event('change', { bubbles: true }));
  await esperar(200);
  log('duración         : ' + d.getElementById('f-dur').value);

  d.getElementById('f-operador').value = 'Operador de prueba';
  d.getElementById('btnGuardar').click();
  await esperar(1200);
  log('aviso faltantes  : ' + (cerrarAvisoUI(d) || '(no salió)'));
  await esperar(300);
  const f = await leerFicha('RG-51-02-IDA');
  log('botón al guardar : ' + etiquetaBoton(d) + ' (esperado EDITAR FICHA)');
  log('ficha guardada   : ' + !!f);
  if (f) {
    log('altura guardada  : ' + JSON.stringify(f.alturaAntena) + ' (tipo ' + typeof f.alturaAntena + ')');
    log('inicio / fin     : ' + f.inicio + ' / ' + f.fin + ' · dur=' + f.duracionMin);
    log('croquis en la ficha: ' + (f.croquis ? 'guardado (viejo)' : 'no se guarda (viene con la app)'));
  }
  log('aviso de guardado: "' + d.getElementById('toast').textContent + '"');
  // cuánto tarda abrir "Ver ficha guardada"
  d.getElementById('btnDetBack').click();
  await esperar(300);
  d.querySelector('.combo-item[data-id="RG-51-02-IDA"]').click();
  await esperar(200);
  const tD = w.performance.now();
  d.getElementById('btnVerFicha').click();
  for (let i = 0; i < 80; i++) {
    await esperar(50);
    if (!d.getElementById('v-detalle').classList.contains('hidden') && d.getElementById('d-datos').textContent.length > 20) break;
  }
  log('tiempo del detalle: ' + Math.round(w.performance.now() - tD) + ' ms · fotos=' + d.getElementById('d-fotos').children.length);
  log('sin mapa         : ' + !d.getElementById('d-map'));
  log('observaciones   : ' + (d.getElementById('d-obsPanel') && !d.getElementById('d-obsPanel').classList.contains('hidden') ? '"' + d.getElementById('d-obs').textContent + '"' : 'NO SE MUESTRAN'));
  // copia completa del día (ZIP con PDF + fotos + datos)
  d.getElementById('btnDetBack').click();
  await esperar(300);
  d.querySelectorAll('.tabs button').forEach((b) => { if (b.dataset.tab === 'respaldo') b.click(); });
  await esperar(400);
  log('días en la copia : ' + [...d.getElementById('diaCopia').options].map((o) => o.textContent).join(', '));
  const nZip = [];
  const bajar = w.URL.createObjectURL;
  w.URL.createObjectURL = (b) => { if (b && b.size) nZip.push(b.size); return bajar.call(w.URL, b); };
  d.getElementById('btnCopiaDia').click();
  for (let i = 0; i < 60; i++) { await esperar(100); if (nZip.length) break; }
  w.URL.createObjectURL = bajar;
  log('ZIP de la copia  : ' + (nZip.length ? Math.round(nZip[0] / 1024) + ' KB' : 'NO SE GENERÓ'));
  log('aviso de la copia: "' + d.getElementById('toast').textContent + '"');
  /* ---- cambio a Pruebas Rumiñahui: 3 puntos, nada de Pedro Moncayo ---- */
  d.querySelectorAll('.tabs button').forEach((b) => { if (b.dataset.tab === 'respaldo') b.click(); });
  await esperar(300);
  /* ---- guardado parcial + confirmación al volver ---- */
  d.querySelectorAll('.tabs button').forEach((b) => { if (b.dataset.tab === 'puntos') b.click(); });
  await esperar(300);
  d.getElementById('comboBtn').click();
  await esperar(200);
  const itemParcial = d.querySelector('.combo-item[data-id="RG-52-01-IDA"]');
  log('item a medias   : ' + (itemParcial ? 'encontrado' : 'NO'));
  if (itemParcial) {
    itemParcial.click();
    await esperar(300);
    d.getElementById('btnLevantar').click();
    await esperar(900);
    const txaObs = d.getElementById('f-obs');
    if (txaObs) { txaObs.value = 'Ficha a medias para probar'; txaObs.dispatchEvent(new w.Event('input', { bubbles: true })); }
    d.getElementById('btnGuardar').click();
    await esperar(1200);
    const veloAviso = d.getElementById('v-aviso');
    log('aviso al guardar: ' + (veloAviso && !veloAviso.classList.contains('hidden')
      ? '"' + d.getElementById('avisoTitulo').textContent + '" · faltan=' + d.querySelectorAll('#avisoTexto li').length
      : 'NO SALIÓ'));
    const btnOk = d.querySelector('#avisoBotones .btn.primary');
    if (btnOk) btnOk.click();
    await esperar(600);
    const parcial = await leerFicha('RG-52-01-IDA');
    log('ficha parcial   : guardada=' + !!parcial + ' · sin receptor=' + (!parcial || !parcial.receptor));
    const chip = d.querySelector('.combo-item[data-id="RG-52-01-IDA"] .chip-inc');
    log('chip incompleta : ' + (chip ? 'sí' : 'NO'));

    /* borrar esa ficha: el botón debe volver a LEVANTAR sin tocar la lista */
    d.getElementById('btnVerFicha').click();
    await esperar(700);
    d.getElementById('d-del').click();
    await esperar(900);
    log('botón al borrar : ' + etiquetaBoton(d) + ' (esperado LEVANTAR FICHA)');
    const borrada = await leerFicha('RG-52-01-IDA');
    log('ficha borrada   : ' + (borrada ? 'NO' : 'sí'));

    /* volver con cambios sin guardar */
    d.getElementById('comboBtn').click();
    await esperar(200);
    d.querySelector('.combo-item[data-id="RG-52-01-IDA"]').click();
    await esperar(300);
    d.getElementById('btnLevantar').click();
    await esperar(800);
    const op = d.getElementById('f-operador');
    op.value = 'Otro operador';
    op.dispatchEvent(new w.Event('input', { bubbles: true }));
    d.getElementById('btnFichaBack').click();
    await esperar(500);
    const sigueVelo = !d.getElementById('v-aviso').classList.contains('hidden');
    log('volver avisa    : ' + sigueVelo + ' · "' + d.getElementById('avisoTitulo').textContent + '"');
    const seguir = [...d.querySelectorAll('#avisoBotones .btn')].find((b) => /Seguir/i.test(b.textContent));
    if (seguir) seguir.click();
    await esperar(400);
    log('sigue en ficha  : ' + !d.getElementById('v-ficha').classList.contains('hidden'));
    d.getElementById('btnFichaBack').click();
    await esperar(400);
    const salir = [...d.querySelectorAll('#avisoBotones .btn')].find((b) => /Salir/i.test(b.textContent));
    if (salir) salir.click();
    await esperar(500);
    log('sale a puntos   : ' + !d.getElementById('v-puntos').classList.contains('hidden'));
  }

  /* ---- ficha duplicada en Drive: el aviso debe salir y no quedarse "Revisando Drive…" ---- */
  d.querySelectorAll('.tabs button').forEach((b) => { if (b.dataset.tab === 'puntos') b.click(); });
  await esperar(300);

  /* dos fotos de prueba para que la ficha quede "completa" */
  const pngB64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==';
  const ponerFoto = (fichaId, tipo, orden) => new Promise((res) => {
    const rq = indexedDB.open('fichas-gnss');
    rq.onsuccess = () => {
      const db = rq.result;
      const bytes = Uint8Array.from(atob(pngB64), (c) => c.charCodeAt(0));
      const blob = new Blob([bytes], { type: 'image/png' });
      const tx = db.transaction(['photos', 'pmeta'], 'readwrite');
      tx.objectStore('photos').put({ id: 'p-' + fichaId + '-' + tipo, blob, orig: blob });
      tx.objectStore('pmeta').put({
        id: 'p-' + fichaId + '-' + tipo, fichaId, tipo, orden, w: 1, h: 1, nombre: tipo + '.png',
        thumb: 'data:image/png;base64,' + pngB64
      });
      tx.oncomplete = () => { db.close(); res(true); };
      tx.onerror = () => { db.close(); res(false); };
    };
    rq.onerror = () => res(false);
  });

  const idDup = 'RG-53-01-IDA';
  await ponerFoto(idDup, 'punto', 1);
  await ponerFoto(idDup, 'placa', 2);

  /* Drive configurado y un script simulado que dice que la ficha ya existe */
  let DriveUI = null;
  try { DriveUI = w.eval('Drive'); } catch (e) { DriveUI = null; }
  log('Drive accesible : ' + (DriveUI && typeof DriveUI.guardarConfig === 'function' ? 'sí' : 'NO'));
  if (DriveUI && typeof DriveUI.guardarConfig === 'function') await DriveUI.guardarConfig('https://script.google.com/macros/s/AKfycbzPRUEBA123/exec', 'clave');
  const fetchRealUI = w.fetch;
  w.fetch = async () => ({
    ok: true, status: 200,
    text: async () => JSON.stringify({
      ok: true, existe: true, copias: 0,
      existente: { nombre: 'RG-53-01_IDA.pdf', tamano: 1000, actualizado: '2026-11-03 14:22' },
      autor: { operador: 'Otra Persona', fecha: '2026-11-03' }
    }),
    json: async () => ({ ok: true, existe: true })
  });

  d.getElementById('comboBtn').click();
  await esperar(250);
  d.querySelector('.combo-item[data-id="' + idDup + '"]').click();
  await esperar(300);
  d.getElementById('btnLevantar').click();
  await esperar(900);
  d.getElementById('f-receptor').selectedIndex = 1;
  d.getElementById('f-altura').value = '1,500';
  d.querySelector('[data-ahora="inicio"]').click();
  await esperar(250);
  const tIni = new Date(d.getElementById('f-inicio').value);
  tIni.setMinutes(tIni.getMinutes() + 5);
  const dd = (x) => String(x).padStart(2, '0');
  d.getElementById('f-fin').value = tIni.getFullYear() + '-' + dd(tIni.getMonth() + 1) + '-' + dd(tIni.getDate()) +
    'T' + dd(tIni.getHours()) + ':' + dd(tIni.getMinutes());
  d.getElementById('f-fin').dispatchEvent(new w.Event('change', { bubbles: true }));
  await esperar(250);
  d.getElementById('f-operador').value = 'Operador duplicado';
  d.getElementById('btnGuardar').click();
  await esperar(2000);            // la subida automática encuentra el duplicado

  const veloDup = d.getElementById('v-aviso');
  const abierto = veloDup && !veloDup.classList.contains('hidden');
  log('duplicado avisa : ' + (abierto ? '"' + d.getElementById('avisoTitulo').textContent + '"' : 'NO SALIÓ') +
      ' · opciones=' + [...d.querySelectorAll('#avisoBotones .btn')].map((b) => b.textContent).join(' / '));
  log('velo de trabajo: ' + (d.getElementById('busy').classList.contains('hidden') ? 'oculto' : 'SIGUE VISIBLE'));
  log('aviso autor     : ' + (d.querySelector('#avisoTexto .alerta') ? 'dice que la subió otra persona' : 'no lo dice'));

  /* cancelar: la ficha queda marcada como conflicto y no se sube nada */
  const cancelar = [...d.querySelectorAll('#avisoBotones .btn')].find((b) => /Ahora no|Cancelar/i.test(b.textContent));
  if (cancelar) cancelar.click();
  await esperar(800);
  const dupFicha = await leerFicha(idDup);
  log('tras cancelar   : aviso=' + (d.getElementById('v-aviso').classList.contains('hidden') ? 'cerrado' : 'SIGUE') +
      ' · estado=' + (dupFicha && dupFicha.drive && dupFicha.drive.estado));
  log('chip conflicto  : ' + (d.querySelector('.combo-item[data-id="' + idDup + '"] .chip-conf') ? 'sí' : 'NO'));

  w.fetch = fetchRealUI;
  if (DriveUI && typeof DriveUI.guardarConfig === 'function') await DriveUI.guardarConfig('', '');
  await esperar(300);

  const btnCambiar = d.querySelector('[data-cambiar-proyecto]');
  log('botón cambiar   : ' + (btnCambiar ? 'presente' : 'FALTA'));
  if (btnCambiar) {
    btnCambiar.click();
    await esperar(400);
    const velo2 = d.getElementById('v-proyecto');
    log('selector otra vez: ' + (velo2 && !velo2.classList.contains('hidden')));
    const btnRumi = d.querySelector('[data-proy="rumi"]');
    if (btnRumi) btnRumi.click();
    await esperar(800);
    const itemsR = [...d.querySelectorAll('.combo-item')];
    log('topbar ahora    : ' + d.getElementById('topSub').textContent + ' · ' + d.querySelector('.proybar b').textContent);
    log('rumiñahui       : ' + itemsR.length + ' fichas · ' + itemsR.map((x) => x.dataset.id).join(', '));
    log('rumiñahui avance: ' + (d.getElementById('avancePill') ? 'SIGUE' : 'retirada'));
    log('rumiñahui puntos: ' + (itemsR.some((x) => /RG-/.test(x.dataset.id)) ? 'SE COLÓ PEDRO MONCAYO' : 'sin puntos de Pedro Moncayo'));
    d.querySelector('.tabs button[data-tab="respaldo"]').click();
    await esperar(400);
    log('copia del día   : ' + [...d.getElementById('diaCopia').options].map((o) => o.textContent).join(','));
  }
  /* ---- brújula: eventos de orientación simulados ---- */
  d.querySelectorAll('.tabs button').forEach((b) => { if (b.dataset.tab === 'puntos') b.click(); });
  await esperar(400);
  const hayBrujula = !!d.getElementById('brujulaRosa');
  log('brújula         : ' + (hayBrujula ? 'presente · trazos=' + d.querySelectorAll('#brujulaRosa *').length : 'FALTA'));
  if (hayBrujula) {
    d.getElementById('btnBrujula').click();
    await esperar(300);
    const lanzar = (alpha) => {
      const ev = new w.DeviceOrientationEvent('deviceorientationabsolute', { alpha, beta: 0, gamma: 0, absolute: true });
      w.dispatchEvent(ev);
    };
    lanzar(300);   // 360-300 = 60°
    await esperar(500);
    const caja = d.getElementById('brujula');
    const rosa = d.getElementById('brujulaRosa');
    log('sensor 60°      : texto=' + d.getElementById('brujulaGrados').textContent +
        ' · rumbo=' + d.getElementById('brujulaRumbo').textContent +
        ' · giro=' + rosa.style.transform + ' · verde=' + caja.classList.contains('norte'));
    lanzar(0);     // 0° = norte
    await esperar(900);
    log('sensor norte    : texto=' + d.getElementById('brujulaGrados').textContent +
        ' · rumbo=' + d.getElementById('brujulaRumbo').textContent +
        ' · verde=' + caja.classList.contains('norte'));
    lanzar(1);     // 359°, justo antes del norte
    await esperar(800);
    const tAntes = rosa.style.transform;
    lanzar(0);     // 0°: cruce del norte (no debe girar 360)
    await esperar(800);
    log('cruce del norte : ' + tAntes + ' → ' + rosa.style.transform +
        ' · verde=' + caja.classList.contains('norte'));
    /* una lectura relativa (sin magnetómetro) no debe pisar la magnética */
    w.dispatchEvent(new w.DeviceOrientationEvent('deviceorientation',
      { alpha: 180, beta: 0, gamma: 0, absolute: false }));
    await esperar(700);
    log('lectura relativa: giro=' + rosa.style.transform + ' · verde=' +
        caja.classList.contains('norte') + ' · chip=' + d.getElementById('brujulaRumbo').textContent);
    lanzar(90);    // 270° (oeste)
    await esperar(900);
    log('sensor 270°     : rumbo=' + d.getElementById('brujulaRumbo').textContent +
        ' · verde=' + caja.classList.contains('norte') +
        ' · aviso="' + d.getElementById('brujulaMsg').textContent + '"');
  }
  /* ---- iPhone: webkitCompassHeading (el evento NO es 'absolute') ---- */
  const evIOS = (rumbo) => {
    const ev = new w.Event('deviceorientation');
    ev.alpha = 0; ev.beta = 90; ev.gamma = 0; ev.absolute = false;
    ev.webkitCompassHeading = rumbo;
    w.dispatchEvent(ev);
  };
  evIOS(90);
  await esperar(800);
  const ios1 = d.getElementById('brujulaRosa').style.transform;
  evIOS(180);
  await esperar(900);
  const ios2 = d.getElementById('brujulaRosa').style.transform;
  log('iphone 90→180   : ' + ios1 + ' → ' + ios2 +
      ' · rumbo=' + d.getElementById('brujulaRumbo').textContent +
